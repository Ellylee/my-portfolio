<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다자산 포트폴리오 히트맵 대시보드</title>
  
  <!-- Tailwind CSS & React UI Scripts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Recharts UMD 빌드가 전역 PropTypes를 사용하므로 Recharts보다 먼저 불러옵니다. -->
  <script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js"></script>

  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const rootElement = document.getElementById('root');

      if (!window.React || !window.ReactDOM || !window.PropTypes) {
        rootElement.innerHTML = '<div style="color:white; padding:20px;">React 관련 라이브러리를 불러오지 못했습니다. 인터넷 연결과 CDN 차단 여부를 확인한 뒤 새로고침해 주세요.</div>';
        return;
      }

      const { useState, useMemo, createElement: h, Fragment } = React;
      const RechartsLib = window.Recharts || window.recharts;

      if (!RechartsLib) {
        rootElement.innerHTML = '<div style="color:white; padding:20px;">Recharts를 불러오지 못했습니다. 인터넷 연결과 CDN 차단 여부를 확인한 뒤 새로고침해 주세요.</div>';
        return;
      }

      const { ResponsiveContainer, Treemap, Tooltip } = RechartsLib;
      const USD_KRW = 1385;

      const portfolio = [
        {
          name: "미국주식",
          type: "stock",
          children: [
            { name: "NVDA", fullName: "NVIDIA", value: 14500000, pnl: 3200000, returnPct: 28.3 },
            { name: "AAPL", fullName: "Apple", value: 9800000, pnl: 1100000, returnPct: 12.6 },
            { name: "MSFT", fullName: "Microsoft", value: 9200000, pnl: 1450000, returnPct: 18.7 },
            { name: "AMZN", fullName: "Amazon", value: 6500000, pnl: 520000, returnPct: 8.7 },
            { name: "GOOGL", fullName: "Alphabet", value: 5400000, pnl: -180000, returnPct: -3.2 },
            { name: "META", fullName: "Meta Platforms", value: 4800000, pnl: 720000, returnPct: 17.6 },
            { name: "TSLA", fullName: "Tesla", value: 4200000, pnl: -630000, returnPct: -13.0 },
            { name: "SPY", fullName: "SPDR S&P 500 ETF", value: 11500000, pnl: 980000, returnPct: 9.3 },
            { name: "QQQ", fullName: "Invesco QQQ", value: 8800000, pnl: 1120000, returnPct: 14.6 }
          ]
        },
        {
          name: "한국주식",
          type: "stock",
          children: [
            {
              name: "일반 주식계좌",
              account: true,
              children: [
                { name: "삼성전자", fullName: "삼성전자", value: 10500000, pnl: 820000, returnPct: 8.5 },
                { name: "SK하이닉스", fullName: "SK하이닉스", value: 7600000, pnl: 1310000, returnPct: 20.8 },
                { name: "KODEX 200", fullName: "KODEX 200", value: 6200000, pnl: 310000, returnPct: 5.3 }
              ]
            },
            {
              name: "ISA 계좌",
              account: true,
              children: [
                { name: "TIGER 미국S&P500", fullName: "TIGER 미국S&P500", value: 9200000, pnl: 1160000, returnPct: 14.4 },
                { name: "TIGER 미국나스닥100", fullName: "TIGER 미국나스닥100", value: 7100000, pnl: 1250000, returnPct: 21.4 },
                { name: "삼성전자", fullName: "삼성전자", value: 4200000, pnl: -140000, returnPct: -3.2 }
              ]
            },
            {
              name: "연금저축",
              account: true,
              children: [
                { name: "TIGER 미국S&P500", fullName: "TIGER 미국S&P500", value: 6800000, pnl: 720000, returnPct: 11.8 },
                { name: "KODEX 200", fullName: "KODEX 200", value: 3900000, pnl: 210000, returnPct: 5.7 }
              ]
            }
          ]
        },
        {
          name: "금",
          type: "gold",
          children: [
            { name: "KRX 금현물", fullName: "KRX 금현물", value: 8200000, pnl: 940000, returnPct: 12.9 },
            { name: "ACE KRX금현물", fullName: "ACE KRX금현물 ETF", value: 5100000, pnl: 620000, returnPct: 13.8 }
          ]
        },
        {
          name: "비트코인",
          type: "crypto",
          children: [
            { name: "BTC", fullName: "Bitcoin Spot", value: 12800000, pnl: 2100000, returnPct: 19.6 }
          ]
        },
        {
          name: "현금성 자산",
          type: "cash",
          children: [
            { name: "원화 CMA", fullName: "원화 파킹 / CMA", value: 8500000, pnl: 85000, returnPct: 1.0 },
            { name: "달러 외화RP", fullName: "USD 외화RP", value: 6300000, pnl: 61000, returnPct: 1.0 },
            { name: "단기채", fullName: "미국 단기채", value: 4200000, pnl: 42000, returnPct: 1.0 }
          ]
        }
      ];

      const tabs = [
        { id: "all", label: "전체 포트폴리오" },
        { id: "한국주식", label: "한국주식" },
        { id: "미국주식", label: "미국주식" },
        { id: "금", label: "금" },
        { id: "비트코인", label: "비트코인" },
        { id: "현금성 자산", label: "현금" }
      ];

      function flattenLeaves(nodes, parent, account) {
        const result = [];
        nodes.forEach((node) => {
          if (node.children) {
            const nextAccount = node.account ? node.name : account;
            result.push(...flattenLeaves(node.children, parent || node.name, nextAccount));
          } else {
            result.push(Object.assign({}, node, { assetClass: parent, account: account }));
          }
        });
        return result;
      }

      function flattenAll() {
        return portfolio.reduce((acc, asset) => {
          return acc.concat(flattenLeaves(asset.children, asset.name, null));
        }, []);
      }

      const allLeaves = flattenAll();

      function won(value) {
        return new Intl.NumberFormat("ko-KR", { style: "currency", currency: "KRW", maximumFractionDigits: 0 }).format(value);
      }

      function usd(value) {
        return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 }).format(value / USD_KRW);
      }

      function pct(value) {
        return (value >= 0 ? "+" : "") + value.toFixed(2) + "%";
      }

      function pnlColor(returnPct, isCash) {
        if (isCash) return "#475569";
        if (returnPct > 15) return "#16a34a";
        if (returnPct > 7) return "#22c55e";
        if (returnPct > 0) return "#15803d";
        if (returnPct === 0) return "#374151";
        if (returnPct > -7) return "#b91c1c";
        return "#dc2626";
      }

      function normalizeData(nodes, assetClass, account) {
        return nodes.map((node) => {
          const nextAssetClass = assetClass || (node.children ? node.name : null);
          const nextAccount = node.account ? node.name : account;

          if (node.children) {
            return Object.assign({}, node, {
              assetClass: nextAssetClass,
              account: nextAccount,
              children: normalizeData(node.children, nextAssetClass, nextAccount)
            });
          }
          return Object.assign({}, node, {
            assetClass: nextAssetClass || assetClass,
            account: nextAccount,
            size: node.value
          });
        });
      }

      function Tile(props) {
        const x = props.x, y = props.y, width = props.width, height = props.height, name = props.name, returnPct = props.returnPct, assetClass = props.assetClass;
        if (width < 35 || height < 25) return null;
        const isCash = assetClass === "현금성 자산";
        const background = pnlColor(returnPct, isCash);
        const compact = width < 80 || height < 50;

        return h("g", null,
          h("rect", {
            x: x, y: y, width: width, height: height, rx: 3, ry: 3, fill: background, stroke: "#0f172a", strokeWidth: 2,
            className: "transition-opacity duration-150 hover:opacity-80 cursor-pointer"
          }),
          !compact && h(Fragment, null,
            h("text", { x: x + width / 2, y: y + height / 2 - 6, textAnchor: "middle", dominantBaseline: "middle", fill: "white", fontSize: Math.min(16, Math.max(10, width / 7)), fontWeight: "800" }, name),
            height > 45 && h("text", { x: x + width / 2, y: y + height / 2 + 12, textAnchor: "middle", dominantBaseline: "middle", fill: "white", fontSize: Math.min(12, Math.max(9, width / 10)), fontWeight: "700" }, pct(returnPct))
          ),
          compact && width > 45 && height > 28 && h("text", { x: x + width / 2, y: y + height / 2, textAnchor: "middle", dominantBaseline: "middle", fill: "white", fontSize: "10", fontWeight: "800" }, name.length > 7 ? name.slice(0, 6) + "…" : name)
        );
      }

      function TreemapNode(props) {
        const x = props.x, y = props.y, width = props.width, height = props.height, name = props.name, children = props.children, returnPct = props.returnPct, assetClass = props.assetClass, onDrill = props.onDrill;
        if (children) {
          return h("g", { onClick: function() { if (onDrill) onDrill(props); }, className: onDrill ? "cursor-pointer" : "" },
            h("rect", { x: x, y: y, width: width, height: height, fill: "#1e293b", stroke: "#0f172a", strokeWidth: 3, rx: 3 }),
            width > 80 && height > 24 && h("text", { x: x + 8, y: y + 16, fill: "#94a3b8", fontSize: "11", fontWeight: "800" }, name)
          );
        }
        return h(Tile, { x: x, y: y, width: width, height: height, name: name, returnPct: returnPct || 0, assetClass: assetClass });
      }

      function Row(props) {
        return h("div", { className: "flex items-center justify-between gap-4" },
          h("span", { className: "text-slate-500" }, props.label),
          h("span", { className: "font-semibold " + (props.valueClass || "text-slate-200") }, props.value)
        );
      }

      function CustomTooltip(props) {
        const active = props.active, payload = props.payload;
        if (!active || !payload || !payload.length) return null;
        const item = payload[0] && payload[0].payload;
        if (!item || !item.value) return null;
        const assetClass = item.assetClass;
        const isCash = assetClass === "현금성 자산";
        const totalSum = allLeaves.reduce((sum, i) => sum + i.value, 0);

        return h("div", { className: "min-w-[240px] rounded-lg border border-slate-600 bg-slate-950/95 p-3 text-xs shadow-2xl backdrop-blur" },
          h("div", { className: "mb-2 flex items-center justify-between gap-4" },
            h("div", null,
              h("div", { className: "text-sm font-bold text-white" }, item.name),
              h("div", { className: "text-[11px] text-slate-400" }, item.fullName || "")
            ),
            h("div", { className: "rounded px-2 py-1 font-bold text-white", style: { background: pnlColor(item.returnPct, isCash) } }, pct(item.returnPct))
          ),
          h("div", { className: "space-y-1.5 border-t border-slate-800 pt-2" },
            h(Row, { label: "자산군", value: assetClass }),
            item.account && h(Row, { label: "계좌", value: item.account }),
            h(Row, { label: "평가금액", value: won(item.value) }),
            h(Row, { label: "USD", value: usd(item.value) }),
            h(Row, { label: "보유비중", value: ((item.value / totalSum) * 100).toFixed(2) + "%" }),
            h(Row, { label: "평가손익", value: won(item.pnl || 0), valueClass: (item.pnl || 0) >= 0 ? "text-green-400" : "text-red-400" })
          )
        );
      }

      function Metric(props) {
        return h("div", { className: "rounded-md border border-slate-800 bg-slate-900/80 px-3 py-1.5" },
          h("div", { className: "text-[9px] font-semibold uppercase tracking-wider text-slate-600" }, props.label),
          h("div", { className: "text-xs font-black " + (props.positive === true ? "text-green-400" : props.positive === false ? "text-red-400" : "text-white") }, props.value)
        );
      }

      function LegendBox(props) {
        return h("div", { className: "flex items-center gap-1" },
          h("span", { className: "h-2.5 w-2.5 rounded-sm", style: { backgroundColor: props.color } }),
          h("span", null, props.label)
        );
      }

      function PortfolioHeatmap() {
        const activeTabState = useState("all");
        const activeTab = activeTabState[0], setActiveTab = activeTabState[1];

        const currencyState = useState("KRW");
        const currency = currencyState[0], setCurrency = currencyState[1];

        const drillPathState = useState([]);
        const drillPath = drillPathState[0], setDrillPath = drillPathState[1];

        const filteredPortfolio = useMemo(function() {
          if (activeTab === "all") return portfolio;
          return portfolio.filter(function(asset) { return asset.name === activeTab; });
        }, [activeTab]);

        const currentRoot = useMemo(function() {
          if (!drillPath.length) return filteredPortfolio;
          let current = filteredPortfolio;
          for (let i = 0; i < drillPath.length; i++) {
            const name = drillPath[i];
            const found = current.find(function(item) { return item.name === name; });
            if (!found || !found.children) return current;
            current = found.children;
          }
          return current;
        }, [filteredPortfolio, drillPath]);

        const displayData = useMemo(function() {
          const selectedAssetClass = activeTab !== "all"
            ? activeTab
            : (drillPath.length ? drillPath[0] : null);
          const selectedAccount = selectedAssetClass === "한국주식" && drillPath.length > 1
            ? drillPath[1]
            : null;

          return normalizeData(currentRoot, selectedAssetClass, selectedAccount);
        }, [currentRoot, activeTab, drillPath]);

        const total = allLeaves.reduce((sum, item) => sum + item.value, 0);
        const totalPnl = allLeaves.reduce((sum, item) => sum + item.pnl, 0);
        const baseCost = allLeaves.reduce((sum, item) => sum + (item.value - item.pnl), 0);
        const totalReturn = baseCost > 0 ? (totalPnl / baseCost) * 100 : 0;
        const todayPnl = 384000;

        const currencyValue = currency === "KRW" ? won(total) : usd(total);

        const handleDrill = function(node) {
          if (!node || !node.children) return;
          setDrillPath(function(prev) { return prev.concat([node.name]); });
        };

        const resetDrill = function() { setDrillPath([]); };

        return h("div", { className: "min-h-screen bg-[#0f172a] text-slate-100" },
          h("header", { className: "border-b border-slate-800 bg-[#0f172a]" },
            h("div", { className: "mx-auto max-w-[1800px] px-4 py-3" },
              h("div", { className: "flex flex-col gap-3 xl:flex-row xl:items-center xl:justify-between" },
                h("div", { className: "flex items-center gap-3" },
                  h("div", null,
                    h("div", { className: "flex items-center gap-2" },
                      h("h1", { className: "text-lg font-black tracking-tight text-white" }, "PORTFOLIO"),
                      h("span", { className: "rounded bg-slate-800 px-1.5 py-0.5 text-[9px] font-bold text-slate-400" }, "HEATMAP")
                    ),
                    h("div", { className: "text-[10px] uppercase tracking-widest text-slate-500" }, "Multi Asset Allocation")
                  )
                ),
                h("div", { className: "flex flex-wrap items-center gap-2" },
                  h(Metric, { label: "총 자산", value: currencyValue }),
                  h(Metric, { label: "당일 손익", value: (todayPnl >= 0 ? "+" : "") + won(todayPnl), positive: todayPnl >= 0 }),
                  h(Metric, { label: "전체 수익률", value: pct(totalReturn), positive: totalReturn >= 0 }),
                  h("div", { className: "ml-1 flex rounded-md border border-slate-700 bg-slate-900 p-0.5" },
                    ["KRW", "USD"].map(function(c) {
                      return h("button", {
                        key: c,
                        onClick: function() { setCurrency(c); },
                        className: "rounded px-2.5 py-1 text-[10px] font-bold transition " + (currency === c ? "bg-slate-700 text-white" : "text-slate-500 hover:text-slate-300")
                      }, c);
                    })
                  )
                )
              ),
              h("div", { className: "mt-3 flex gap-1 overflow-x-auto pb-0.5" },
                tabs.map(function(tab) {
                  return h("button", {
                    key: tab.id,
                    onClick: function() { setActiveTab(tab.id); resetDrill(); },
                    className: "whitespace-nowrap rounded-md px-3 py-1.5 text-xs font-bold transition " + (activeTab === tab.id ? "bg-slate-100 text-slate-950" : "text-slate-400 hover:bg-slate-800 hover:text-white")
                  }, tab.label);
                })
              )
            )
          ),
          h("main", { className: "mx-auto max-w-[1800px] px-4 py-3" },
            h("div", { className: "mb-2 flex items-center justify-between" },
              h("div", { className: "flex items-center gap-2 text-[11px]" },
                h("button", { onClick: resetDrill, className: "font-semibold text-slate-400 hover:text-white" }, "전체"),
                drillPath.map(function(path, index) {
                  return h(Fragment, { key: path + "-" + index },
                    h("span", { className: "text-slate-700" }, "/"),
                    h("button", {
                      onClick: function() { setDrillPath(drillPath.slice(0, index + 1)); },
                      className: "font-semibold text-slate-300 hover:text-white"
                    }, path)
                  );
                })
              ),
              h("div", { className: "text-[10px] text-slate-600" }, drillPath.length ? drillPath.join(" / ") : "전체 포트폴리오")
            ),
            h("section", { className: "overflow-hidden rounded-lg border border-slate-800 bg-[#1e293b] shadow-2xl" },
              h("div", { className: "h-[calc(100vh-190px)] min-h-[520px] w-full" },
                h(ResponsiveContainer, { width: "100%", height: "100%" },
                  h(Treemap, {
                    data: displayData, dataKey: "size", nameKey: "name", aspectRatio: 1.7, stroke: "#0f172a",
                    content: h(TreemapNode, { onDrill: handleDrill })
                  }, h(Tooltip, { content: h(CustomTooltip) }))
                )
              )
            ),
            h("div", { className: "mt-2 flex flex-wrap items-center justify-between gap-3 rounded-md border border-slate-800 bg-slate-900/70 px-3 py-2" },
              h("div", { className: "flex items-center gap-2 text-[10px] text-slate-500" },
                h("span", null, "수익률"),
                h(LegendBox, { color: "#dc2626", label: "-10%" }),
                h(LegendBox, { color: "#b91c1c", label: "-5%" }),
                h(LegendBox, { color: "#374151", label: "0%" }),
                h(LegendBox, { color: "#15803d", label: "+5%" }),
                h(LegendBox, { color: "#22c55e", label: "+10%" }),
                h(LegendBox, { color: "#16a34a", label: "+20%" })
              ),
              h("div", { className: "text-[10px] text-slate-600" }, "면적 = 평가금액 · 색상 = 수익률 · Hover = 상세정보 · 클릭 = Drill-down")
            )
          )
        );
      }

      try {
        const root = ReactDOM.createRoot(rootElement);
        root.render(h(PortfolioHeatmap));
      } catch (error) {
        console.error(error);
        rootElement.innerHTML = '<div style="color:white; padding:20px;">화면을 그리는 중 오류가 발생했습니다. 개발자 도구의 Console을 확인해 주세요.</div>';
      }
    });
  </script>
</body>
</html>
